<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera minimalista en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.lam{width:390px;height:120px;background:#E9ECF5;font-family:Inter,sans-serif;color:#0F172A;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 16px}
.lam *{box-sizing:border-box}
h1{margin:0 auto 0 0;font-size:20px;font-weight:700}
.redondo{width:40px;height:40px;border-radius:50%;border:1px solid #E2E8F0;background:#fff;color:#334155;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#EF4444;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #E9ECF5}
.yo{width:40px;height:40px;border-radius:50%;border:0;background:#0052FF;color:#fff;font:700 13px Inter,sans-serif;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<header class="lam">
  <h1>Usuarios</h1>
  <button class="redondo" type="button" aria-label="Nuevo usuario"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="redondo" type="button" aria-label="Notificaciones, 2 nuevas"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge">2</span></button>
  <button class="yo" type="button" aria-label="Mi cuenta: Ana Norte">AN</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
