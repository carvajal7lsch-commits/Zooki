<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera minimalista · opción A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.lam{width:1440px;height:120px;background:#E9ECF5;font-family:Inter,sans-serif;color:#0F172A;box-sizing:border-box;display:flex;align-items:center;gap:20px;padding:0 40px 0 132px}
.lam *{box-sizing:border-box}
.ttl{display:flex;align-items:center;gap:12px;margin-right:auto}
.ico{width:40px;height:40px;border-radius:12px;background:rgba(0,82,255,.08);color:#0052FF;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:20px;font-weight:700}
.sub{font-size:13px;color:#64748B;margin-top:2px}
.clinica{height:40px;border-radius:20px;border:1px solid #E2E8F0;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;font:600 13px Inter,sans-serif;color:#0F172A}
.cn{width:28px;height:28px;border-radius:50%;background:rgba(0,82,255,.1);color:#0052FF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.redondo{width:40px;height:40px;border-radius:50%;border:1px solid #E2E8F0;background:#fff;color:#334155;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#EF4444;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #E9ECF5}
.yo{width:40px;height:40px;border-radius:50%;border:0;background:#0052FF;color:#fff;font:700 13px Inter,sans-serif;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<header class="lam">
  <div class="ttl">
    <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2.2.6 3.5 2.6 3.5 5.5"/></svg></span>
    <div><h1>Usuarios</h1><div class="sub">Personal y clientes de la clínica</div></div>
  </div>
  <button class="clinica" type="button" aria-label="Cambiar de clínica o rol"><span class="cn">CN</span>Clínica Norte<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="redondo" type="button" aria-label="Notificaciones, 2 nuevas"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge">2</span></button>
  <button class="yo" type="button" aria-label="Mi cuenta: Ana Norte, Administrador">AN</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
