<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tel{width:390px;height:844px;background:#C9CDD8;font-family:Inter,sans-serif;color:#0F172A;position:relative;overflow:hidden;box-sizing:border-box}
.tel *{box-sizing:border-box}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 0 24px;box-shadow:0 -12px 32px rgba(15,23,42,.18)}
.asa{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 10px;border:0;display:block}
.ph{display:flex;align-items:center;gap:10px;padding:0 12px 12px 16px;border-bottom:1px solid #F1F5F9}
.ph h2{margin:0;font-size:18px;font-weight:700}
.ph p{margin:2px 0 0;font-size:13px;color:#64748B}
.todas{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;color:#0052FF;display:flex;align-items:center;justify-content:center}
.it{display:grid;grid-template-columns:40px minmax(0,1fr) 10px;gap:12px;padding:12px 16px;border-bottom:1px solid #F1F5F9;text-decoration:none;color:inherit;align-items:start}
.it.nueva{background:rgba(0,82,255,.04)}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ic-azu{background:rgba(0,82,255,.1);color:#0052FF}
.ic-amb{background:#FEF3C7;color:#B45309}
.ic-roj{background:#FEE2E2;color:#B91C1C}
.ic-gri{background:#F1F5F9;color:#475569}
.t{font-size:15px;font-weight:700}
.m{font-size:14px;color:#475569;margin-top:2px;line-height:1.4}
.h{font-size:12px;color:#64748B;margin-top:4px}
.pt{width:8px;height:8px;border-radius:50%;background:#0052FF;margin-top:6px}
</style>
</helmet>
<div class="tel">
  <section class="hoja" role="dialog" aria-labelledby="notifTitulo">
    <button class="asa" type="button" aria-label="Cerrar notificaciones"></button>
    <header class="ph"><div><h2 id="notifTitulo">Notificaciones</h2><p>2 sin leer</p></div><button class="todas" type="button" aria-label="Marcar todas como leídas" title="Marcar todas como leídas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5l4.5 4.5L15 8.5"/><path d="M11 15.5l1.5 1.5L21 8.5"/></svg></button></header>
    <a class="it nueva" href="#"><span class="ic ic-azu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"/></svg></span><span><div class="t">Nueva cita</div><div class="m">Luna (Fabio Propietario) · vie 30/10, 10:00 a. m.</div><div class="h">hace 5 min</div></span><span class="pt" aria-label="No leída"></span></a>
    <a class="it nueva" href="#"><span class="ic ic-azu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15h6M13 13l2 2-2 2"/></svg></span><span><div class="t">Cita reprogramada</div><div class="m">Max pasó al lun 2/11, 9:00 a. m.</div><div class="h">hace 1 h</div></span><span class="pt" aria-label="No leída"></span></a>
    <a class="it" href="#"><span class="ic ic-azu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span><span><div class="t">Ausencias</div><div class="m">Tu ausencia del mié 28/10 fue aprobada.</div><div class="h">ayer</div></span><span></span></a>
    <a class="it" href="#" style="border-bottom: 0"><span class="ic ic-roj"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M10 13l4 4M14 13l-4 4"/></svg></span><span><div class="t">Cita cancelada</div><div class="m">Bruno · jue 29/10, 4:30 p. m.</div><div class="h">26 oct</div></span><span></span></a>
  </section>
</div>
</x-dc>

</script>
</body>
</html>
