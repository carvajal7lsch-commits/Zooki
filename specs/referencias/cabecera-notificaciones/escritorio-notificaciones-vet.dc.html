<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones del veterinario en escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.lam{width:460px;height:640px;background:#E9ECF5;font-family:Inter,sans-serif;color:#0F172A;box-sizing:border-box;padding:20px 20px 0;position:relative}
.lam *{box-sizing:border-box}
.barra{display:flex;justify-content:flex-end;gap:10px}
.box{height:48px;border-radius:14px;background:#fff;border:0;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 2px 8px rgba(15,23,42,.06);font-family:inherit;color:#0F172A}
.bell{width:48px;justify-content:center;padding:0;position:relative;color:#0052FF;outline:2px solid rgba(0,82,255,.25)}
.badge{position:absolute;top:-5px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#EF4444;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #E9ECF5}
.av{width:32px;height:32px;border-radius:50%;background:#0052FF;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.panel{position:absolute;right:20px;top:80px;width:380px;background:#fff;border-radius:18px;box-shadow:0 16px 40px rgba(15,23,42,.16);overflow:hidden;border:1px solid #E2E8F0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid #F1F5F9}
.ph h3{margin:0;font-size:16px;font-weight:700}
.ph p{margin:2px 0 0;font-size:12px;color:#64748B}
.todas{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;color:#0052FF;display:flex;align-items:center;justify-content:center}
.it{display:grid;grid-template-columns:36px minmax(0,1fr) 10px;gap:12px;padding:12px 16px;border-bottom:1px solid #F1F5F9;text-decoration:none;color:inherit;align-items:start}
.it.nueva{background:rgba(0,82,255,.04)}
.ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.ic-azu{background:rgba(0,82,255,.1);color:#0052FF}
.ic-amb{background:#FEF3C7;color:#B45309}
.ic-roj{background:#FEE2E2;color:#B91C1C}
.ic-gri{background:#F1F5F9;color:#475569}
.t{font-size:14px;font-weight:700}
.m{font-size:13px;color:#475569;margin-top:2px;line-height:1.4}
.h{font-size:12px;color:#64748B;margin-top:4px}
.pt{width:8px;height:8px;border-radius:50%;background:#0052FF;margin-top:6px}
.pie{padding:10px 16px;font-size:12px;color:#64748B;text-align:center}
</style>
</helmet>
<div class="lam">
  <div class="barra">
    <button class="box bell" type="button" aria-label="Notificaciones, 2 nuevas" aria-expanded="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge">2</span></button>
    <button class="box" type="button" aria-label="Mi cuenta"><span class="av">BN</span><strong style="font-size: 14px">Beto</strong></button>
  </div>
  <section class="panel" aria-label="Notificaciones">
    <header class="ph"><div><h3>Notificaciones</h3><p>2 sin leer</p></div><button class="todas" type="button" aria-label="Marcar todas como leídas" title="Marcar todas como leídas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5l4.5 4.5L15 8.5"/><path d="M11 15.5l1.5 1.5L21 8.5"/></svg></button></header>
    <a class="it nueva" href="#"><span class="ic ic-azu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"/></svg></span><span><div class="t">Nueva cita</div><div class="m">Luna (Fabio Propietario) · vie 30/10, 10:00 a. m.</div><div class="h">hace 5 min</div></span><span class="pt" aria-label="No leída"></span></a>
    <a class="it nueva" href="#"><span class="ic ic-azu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15h6M13 13l2 2-2 2"/></svg></span><span><div class="t">Cita reprogramada</div><div class="m">Max pasó al lun 2/11, 9:00 a. m.</div><div class="h">hace 1 h</div></span><span class="pt" aria-label="No leída"></span></a>
    <a class="it" href="#"><span class="ic ic-azu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span><span><div class="t">Ausencias</div><div class="m">Tu ausencia del mié 28/10 fue aprobada.</div><div class="h">ayer</div></span><span></span></a>
    <a class="it" href="#" style="border-bottom: 0"><span class="ic ic-roj"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M10 13l4 4M14 13l-4 4"/></svg></span><span><div class="t">Cita cancelada</div><div class="m">Bruno · jue 29/10, 4:30 p. m.</div><div class="h">26 oct</div></span><span></span></a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
