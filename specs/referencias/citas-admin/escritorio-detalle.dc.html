<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Citas · Detalle de la cita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fondo{width:560px;height:560px;background:rgba(15,23,42,.45);font-family:Inter,sans-serif;color:#0F172A;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.fondo *{box-sizing:border-box}
.dlg{width:500px;background:#fff;border-radius:22px;box-shadow:0 24px 48px rgba(15,23,42,.24);overflow:hidden}
.head{display:flex;align-items:flex-start;gap:14px;padding:22px 22px 18px;border-bottom:1px solid #E2E8F0}
.ico{width:44px;height:44px;border-radius:14px;background:rgba(0,82,255,.08);color:#0052FF;display:flex;align-items:center;justify-content:center;flex:none}
h2{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.st{height:26px;border-radius:13px;padding:0 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:#E0E7FF;color:#3730A3}
.cuando{font-size:14px;color:#475569;margin-top:6px}
.x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;color:#475569;display:flex;align-items:center;justify-content:center;flex:none}
.datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:6px 22px 4px}
.dato{padding:14px 0;border-bottom:1px solid #F1F5F9}
.et{font-size:12px;color:#64748B;font-weight:600}
.va{font-size:15px;font-weight:700;margin-top:4px}
.motivo{margin:14px 22px 22px;padding:14px 16px;border-radius:14px;background:#F8FAFC;border:1px solid #E2E8F0}
.motivo p{margin:6px 0 0;font-size:14px;line-height:1.5}
</style>
</helmet>
<div class="fondo">
  <section class="dlg" role="dialog" aria-labelledby="detalleTitulo">
    <header class="head">
      <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6.5" cy="9" rx="2" ry="2.6"/><ellipse cx="17.5" cy="9" rx="2" ry="2.6"/><ellipse cx="10" cy="5.5" rx="2" ry="2.6"/><ellipse cx="14" cy="5.5" rx="2" ry="2.6"/><path d="M12 11.5c-3 0-5.5 3.4-5.5 5.6 0 1.6 1.3 2.4 2.8 2.4 1.2 0 1.8-.6 2.7-.6s1.5.6 2.7.6c1.5 0 2.8-.8 2.8-2.4 0-2.2-2.5-5.6-5.5-5.6z"/></svg></span>
      <div>
        <h2 id="detalleTitulo">Kira <span class="st">En curso</span></h2>
        <div class="cuando">27/10/2026 · 09:30 · Vacunación</div>
      </div>
      <button class="x" type="button" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="datos">
      <div class="dato"><div class="et">Paciente</div><div class="va">Kira</div></div>
      <div class="dato"><div class="et">Propietario</div><div class="va">Fabio Propietario</div></div>
      <div class="dato"><div class="et">Veterinario</div><div class="va">Beto Norte</div></div>
      <div class="dato"><div class="et">Tipo de cita</div><div class="va">Vacunación</div></div>
    </div>
    <div class="motivo">
      <div class="et">Motivo</div>
      <p>Refuerzo anual de la vacuna triple felina.</p>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
