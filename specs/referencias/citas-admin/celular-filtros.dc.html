<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Citas · Filtros en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tel{width:390px;height:844px;background:#C9CDD8;font-family:Inter,sans-serif;color:#0F172A;position:relative;overflow:hidden;box-sizing:border-box}
.tel *{box-sizing:border-box}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 16px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 -12px 32px rgba(15,23,42,.18)}
.asa{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 0;border:0;display:block}
h2{margin:0;font-size:18px;font-weight:700}
.campo{display:flex;flex-direction:column;gap:8px}
.et{font-size:13px;font-weight:600;color:#475569}
.ctrl{height:48px;border-radius:12px;border:1px solid #E2E8F0;background:#F8FAFC;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:500 15px Inter,sans-serif;color:#0F172A}
.ctrl.vacio{color:#94A3B8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;border-radius:18px;border:1px solid #E2E8F0;background:#fff;padding:0 14px;font:600 13px Inter,sans-serif;color:#475569}
.chip.on{background:rgba(0,82,255,.08);border-color:rgba(0,82,255,.25);color:#0052FF}
.pie{display:flex;gap:10px;align-items:center;margin-top:4px}
.txt{height:48px;padding:0 14px;border:0;background:none;font:600 15px Inter,sans-serif;color:#0052FF}
.prim{flex:1;height:48px;border-radius:14px;border:0;background:#0052FF;color:#fff;font:700 15px Inter,sans-serif}
</style>
</helmet>
<div class="tel">
  <section class="hoja" role="dialog" aria-labelledby="filtrosTitulo">
    <button class="asa" type="button" aria-label="Cerrar filtros"></button>
    <h2 id="filtrosTitulo">Filtros</h2>
    <label class="campo"><span class="et">Fecha específica <span style="font-weight: 500; color: #94A3B8">(opcional)</span></span>
      <span class="ctrl vacio">dd/mm/aaaa<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span>
    </label>
    <label class="campo"><span class="et">Tipo de cita</span>
      <span class="ctrl">Todos los tipos<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
    </label>
    <div class="campo" role="group" aria-label="Estado">
      <span class="et">Estado</span>
      <div class="chips">
        <button class="chip on" type="button">Todos</button>
        <button class="chip" type="button">Pendiente</button>
        <button class="chip" type="button">Confirmada</button>
        <button class="chip" type="button">En curso</button>
        <button class="chip" type="button">Completada</button>
        <button class="chip" type="button">No asistió</button>
        <button class="chip" type="button">Sin cerrar</button>
        <button class="chip" type="button">Cancelada</button>
      </div>
    </div>
    <div class="pie">
      <button class="txt" type="button">Limpiar</button>
      <a class="prim" href="Movil.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none">Ver 9 citas</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
