<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Citas · Detalle en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tel{width:390px;height:844px;background:#C9CDD8;font-family:Inter,sans-serif;color:#0F172A;position:relative;overflow:hidden;box-sizing:border-box}
.tel *{box-sizing:border-box}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 16px 24px;box-shadow:0 -12px 32px rgba(15,23,42,.18)}
.asa{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 14px;border:0;display:block}
.head{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid #E2E8F0}
.ico{width:44px;height:44px;border-radius:14px;background:rgba(0,82,255,.08);color:#0052FF;display:flex;align-items:center;justify-content:center;flex:none}
h2{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.st{height:24px;border-radius:12px;padding:0 9px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:#E0E7FF;color:#3730A3}
.cuando{font-size:14px;color:#475569;margin-top:4px}
.dato{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #F1F5F9}
.et{font-size:13px;color:#64748B;font-weight:600}
.va{font-size:15px;font-weight:700;text-align:right}
.motivo{margin-top:14px;padding:14px;border-radius:14px;background:#F8FAFC;border:1px solid #E2E8F0}
.motivo p{margin:6px 0 0;font-size:14px;line-height:1.5}
</style>
</helmet>
<div class="tel">
  <section class="hoja" role="dialog" aria-labelledby="detalleMovilTitulo">
    <button class="asa" type="button" aria-label="Cerrar detalle"></button>
    <header class="head">
      <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6.5" cy="9" rx="2" ry="2.6"/><ellipse cx="17.5" cy="9" rx="2" ry="2.6"/><ellipse cx="10" cy="5.5" rx="2" ry="2.6"/><ellipse cx="14" cy="5.5" rx="2" ry="2.6"/><path d="M12 11.5c-3 0-5.5 3.4-5.5 5.6 0 1.6 1.3 2.4 2.8 2.4 1.2 0 1.8-.6 2.7-.6s1.5.6 2.7.6c1.5 0 2.8-.8 2.8-2.4 0-2.2-2.5-5.6-5.5-5.6z"/></svg></span>
      <div>
        <h2 id="detalleMovilTitulo">Kira <span class="st">En curso</span></h2>
        <div class="cuando">27/10/2026 · 09:30</div>
      </div>
    </header>
    <div class="dato"><span class="et">Propietario</span><span class="va">Fabio Propietario</span></div>
    <div class="dato"><span class="et">Veterinario</span><span class="va">Beto Norte</span></div>
    <div class="dato"><span class="et">Tipo de cita</span><span class="va">Vacunación</span></div>
    <div class="motivo">
      <div class="et">Motivo</div>
      <p>Refuerzo anual de la vacuna triple felina.</p>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
