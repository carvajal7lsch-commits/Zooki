<style>
body{margin:0}
.tel{width:390px;height:844px;background:#E9ECF5;font-family:Inter,sans-serif;color:#0F172A;position:relative;overflow:hidden;box-sizing:border-box}
.tel *{box-sizing:border-box}
.cont{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px;height:44px}
.top h1{margin:0 auto 0 0;font-size:20px;font-weight:700}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;border:0;color:#475569;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 8px rgba(15,23,42,.06)}

.yo{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:16px}
.av{width:48px;height:48px;border-radius:50%;background:#0052FF;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.yo strong{display:block;font-size:16px}
.yo span{font-size:13px;color:#64748B}
.gt{font-size:11px;font-weight:700;color:#64748B;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px 0}
.grupo{background:#fff;border-radius:16px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;height:54px;padding:0 14px;border-top:1px solid #F1F5F9;text-decoration:none;color:inherit}
.it:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;background:rgba(0,82,255,.08);color:#0052FF;display:flex;align-items:center;justify-content:center}
.it b{font-size:15px;font-weight:600;flex:1}
.est{font-size:12px;font-weight:600;color:#64748B}
.est.amb{color:#0052FF;background:rgba(0,82,255,.08);border-radius:10px;padding:2px 8px}
.salir{height:52px;border-radius:16px;border:0;background:#FEF2F2;color:#B91C1C;font:700 15px Inter,sans-serif;margin-top:4px}
.barra{position:absolute;left:8px;right:8px;bottom:8px;height:76px;background:#fff;border-radius:24px;box-shadow:0 -4px 20px rgba(15,23,42,.08);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 6px}
.barra a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#475569;text-decoration:none}
.barra a span{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.barra a.on{color:#0052FF}
.barra a.on span{background:rgba(0,82,255,.1)}
</style>

      <a class="it" href="#"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15h6"/></svg></span><b>Ausencias</b><span class="est amb">1 por aprobar</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </nav>

  </div>
