<title>Mapa clínico 3D de Zooki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Una sola escena oscura a pantalla completa: barra arriba, espacio 3D al centro, ficha del nodo a la derecha (hoja inferior en el celular). */
:root{
  --fondo:#FFFFFF;
  --panel:rgba(255,255,255,.92);
  --linea:#E2E8F0;
  --texto:#0F172A;
  --suave:#64748B;
  --marca:#0052FF;
  --alarma:#DC2626;
  --sintoma:#2F6BFF;--diagnostico:#7C3AED;--farmaco:#0D9488;--sustancia:#DB2777;--especie:#334155;--raza:#94A3B8;--condicion:#0891B2;
  --letra:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--fondo);color:var(--texto);font-family:var(--letra);overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
#escena{position:fixed;inset:0}
.barra{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--fondo) 55%,rgba(255,255,255,0));pointer-events:none}
.barra>*{pointer-events:auto}
.marca{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.marca h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.marca p{margin:2px 0 0;font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.buscar{position:relative;width:min(300px,100%)}
.buscar input{width:100%;height:40px;border-radius:12px;border:1px solid var(--linea);background:#F8FAFC;padding:0 12px 0 36px;font-size:14px}
.buscar input::placeholder{color:var(--suave)}
.buscar svg{position:absolute;left:12px;top:12px;color:var(--suave)}
.sug{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(15,23,42,.14)}
.sug button{display:flex;align-items:center;gap:10px;width:100%;height:38px;border:0;background:none;text-align:left;padding:0 12px;font-size:13px;cursor:pointer}
.sug button:hover,.sug button:focus-visible{background:rgba(0,82,255,.07)}
.punto{width:9px;height:9px;border-radius:50%;flex:none}
.controles{display:flex;gap:6px}
.ctl{height:40px;border-radius:12px;border:1px solid var(--linea);background:#fff;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ctl[aria-pressed="true"]{background:rgba(0,82,255,.08);border-color:rgba(0,82,255,.4);color:#0052FF}
.tipos{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tipos::-webkit-scrollbar{display:none}
.tipo{flex:none;height:32px;border-radius:16px;border:1px solid var(--linea);background:#fff;padding:0 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.tipo[aria-pressed="false"]{opacity:.45}
.tipo b{font-weight:600;color:var(--suave)}
.etiquetas{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.et{position:absolute;transform:translate(-50%,10px);white-space:nowrap;font-size:12px;font-weight:600;color:var(--texto);text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 10px #fff;opacity:.95}
.et.tenue{font-size:11px;font-weight:500;color:var(--suave)}
.et.foco{font-size:14px;font-weight:700}
.et.alarma::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alarma);margin-right:5px;vertical-align:1px}
.ficha{position:fixed;z-index:6;top:calc(130px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:340px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--linea);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 40px rgba(15,23,42,.10)}
.fc{padding:18px 18px 14px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:6px;position:relative}
.ojo{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fc h2{margin:0;font-size:20px;font-weight:700;line-height:1.25;padding-right:40px;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:24px;border-radius:12px;padding:0 9px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;background:#F1F5F9;color:#475569}
.chip.rojo{background:#FEF2F2;color:#B91C1C}
.cerrar{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--linea);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fb{flex:1;overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:18px}
.tit{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.rel{display:flex;flex-direction:column;gap:2px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 64px 30px;gap:10px;align-items:center;font-size:13px;border:0;background:none;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:10px;cursor:pointer}
.r:hover{background:#F5F8FF}
.r span{display:flex;align-items:center;gap:8px;min-width:0}
.r span em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peso{height:5px;border-radius:3px;background:#EEF2F7;overflow:hidden}
.peso i{display:block;height:100%;border-radius:3px;background:var(--marca)}
.peso.bloqueo i{background:var(--alarma)}
.r small{font-size:11px;color:var(--suave);text-align:right;font-variant-numeric:tabular-nums}
.fuente{font-size:12px;color:var(--suave);line-height:1.45;border:1px solid var(--linea);border-radius:12px;padding:9px 11px}
.fuente b{display:block;color:var(--texto);font-weight:600;font-size:12.5px}
.nota{font-size:12px;color:var(--suave);line-height:1.5;margin:0}
.ayuda{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-size:12px;color:var(--suave);background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:9px 12px;max-width:calc(100% - 32px)}
.ayuda b{color:var(--texto);font-weight:600}
.ficha[hidden],.sug[hidden],.et[hidden]{display:none}
.fallo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--suave);font-size:14px}
@media (max-width:760px){
  .controles .txt{display:none}
  .ficha{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));width:auto;max-height:56%;border-radius:20px}
  .ayuda{display:none}
}
@media (prefers-reduced-motion:reduce){.sug,.ficha{transition:none}}
</style>

<div id="escena" aria-label="Mapa 3D del conocimiento clínico de Zooki. Usa el buscador para abrir la ficha de un nodo." role="img"></div>
<div class="etiquetas" id="etiquetas" aria-hidden="true"></div>

<header class="barra">
  <div class="marca">
    <h1>Mapa clínico</h1>
    <p id="resumen">Cargando…</p>
  </div>
  <div class="buscar">

  </div>
  <div class="controles">

    <button class="ctl" id="girar" type="button" aria-pressed="true" title="Girar la escena"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span class="txt">Girar</span></button>
    <button class="ctl" id="todo" type="button" aria-pressed="false" title="Ver todo el mapa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="txt">Ver todo</span></button>
    <button class="ctl" id="grande" type="button" aria-pressed="false" aria-label="Pantalla completa" title="Pantalla completa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
  </div>
  <nav class="tipos" id="tipos" aria-label="Mostrar u ocultar tipos"></nav>
</header>

<aside class="ficha" id="ficha" aria-labelledby="fichaTitulo" hidden>
  <div class="fc">
    <span class="ojo" id="fichaTipo"></span>
    <h2 id="fichaTitulo"></h2>
    <div class="chips" id="fichaChips"></div>
    <button class="cerrar" id="cerrar" type="button" aria-label="Cerrar la ficha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="fb" id="fichaCuerpo"></div>
</aside>

<p class="ayuda" id="ayuda">Arrastra para girar · rueda para acercar · <b>toca un nodo</b> para ver sus relaciones</p>

"e":"MSD Veterinary Manual","t":"Toxicoses From Human Analgesics in Animals"},"msd.aine":{"e":"MSD Veterinary Manual","t":"Nonsteroidal Anti-inflammatory Drugs in Animals"},"msd.ectoparasiticidas":{"e":"MSD Veterinary Manual","t":"Ectoparasiticides Used in Small Animals"},"fda.analgesicos":{"e":"U.S. Food and Drug Administration, Center for Veterinary Medicine","t":"Get the Facts about Pain Relievers for Pets"},"msd.ulceras_gi":{"e":"MSD Veterinary Manual","t":"Gastrointestinal Ulcers in Small Animals"},"msd.corticoides":{"e":"MSD Veterinary Manual","t":"Corticosteroids in Animals"},"msd.analgesicos_uso":{"e":"MSD Veterinary Manual","t":"Analgesics Used in Animals"},"msd.psicotropicos":{"e":"MSD Veterinary Manual","t":"Psychotropic Agents for Treatment of Animals"},"wsu.mdr1":{"e":"Washington State University, Washington Animal Disease Diagnostic Laboratory","t":"MDR1 in Dogs"},"msd.otitis_externa":{"e":"MSD Veterinary Manual","t":"Otitis Externa in Animals"},"msd.osteoartritis":{"e":"MSD Veterinary Manual","t":"Osteoarthritis in Dogs and Cats"},"msd.renal":{"e":"MSD Veterinary Manual","t":"Renal Dysfunction in Dogs and Cats"},"msd.diabetes":{"e":"MSD Veterinary Manual","t":"Diabetes Mellitus in Dogs and Cats"},"msd.tos_perreras":{"e":"MSD Veterinary Manual","t":"Kennel Cough"},"msd.aves_enfermedad":{"e":"MSD Veterinary Manual","t":"Illness in Pet Birds"},"msd.conejos_no_infecciosas":{"e":"MSD Veterinary Manual","t":"Noninfectious Diseases of Rabbits"},"zooki.decisiones_b21":{"e":"Zooki (decisiones del dueño del producto)","t":"Plan M2: decisiones del usuario en la revisión de B2"}}};
(function () {
  'use strict';
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const TIPOS = {
    diagnostico: { n: 'Diagnóstico', p: 'Diagnósticos', c: css('--diagnostico') },
    sintoma: { n: 'Síntoma', p: 'Síntomas', c: css('--sintoma') },
    farmaco: { n: 'Fármaco', p: 'Fármacos', c: css('--farmaco') },
    sustancia: { n: 'Sustancia tóxica', p: 'Tóxicos', c: css('--sustancia') },
    especie: { n: 'Especie', p: 'Especies', c: css('--especie') },
    raza: { n: 'Raza', p: 'Razas', c: css('--raza') },
    condicion: { n: 'Condición', p: 'Condiciones', c: css('--condicion') },
  };
  const VERBO = { sugiere: ['Lo sugieren', 'Sugiere'], toxico_para: ['Tóxico para él', 'Es tóxico para'], interactua_con: ['Interactúa con', 'Interactúa con'] };
  const escena = document.getElementById('escena');
  const capa = document.getElementById('etiquetas');
  const $ = id => document.getElementById(id);

  if (typeof ForceGraph3D !== 'function') {
    escena.innerHTML = '<p class="fallo">No se pudo cargar la librería 3D. Revisa la conexión y vuelve a abrir la página.</p>';
    $('resumen').textContent = 'Sin mapa';
    return;
  }

  const nodos = DATOS.nodes;
  const enlaces = DATOS.links;
  const porId = new Map(nodos.map(n => [n.id, n]));
  nodos.forEach(n => { n.vecinos = new Set(); n.enl = []; });
  enlaces.forEach(l => {
    const a = porId.get(l.source), b = porId.get(l.target);
    a.vecinos.add(b); b.vecinos.add(a); a.enl.push(l); b.enl.push(l);
  });
  nodos.forEach(n => { n.grado = n.enl.length; });
  $('resumen').textContent = nodos.length + ' nodos · ' + enlaces.length + ' relaciones · pendiente de validación veterinaria';

  const visibles = new Set(Object.keys(TIPOS));
  let foco = null;
  let resaltados = new Set();
  let enlResaltados = new Set();
  let hover = null;

  const ancho = () => escena.clientWidth;
  const alto = () => escena.clientHeight;
  const g = ForceGraph3D({ controlType: 'orbit' })(escena)
    .width(ancho()).height(alto())
    .backgroundColor(css('--fondo'))
    .showNavInfo(false)
    .graphData({ nodes: nodos, links: enlaces })
    .nodeId('id')
    .nodeLabel(() => '')
    .nodeVal(n => (n.t === 'diagnostico' ? 6 : n.t === 'especie' ? 7 : 2) + n.grado * 0.6)
    .nodeRelSize(3.2)
    .nodeResolution(18)
    .nodeOpacity(0.95)
    .nodeColor(n => {
      const c = TIPOS[n.t]?.c || '#94A3B8';
      if (!foco) return c;
      return resaltados.has(n) ? c : 'rgba(148,163,184,0.18)';
    })
    .nodeVisibility(n => visibles.has(n.t))
    .linkVisibility(l => visibles.has(l.source.t ?? porId.get(l.source).t) && visibles.has(l.target.t ?? porId.get(l.target).t))
    .linkColor(l => {
      const base = l.e === 'bloqueo' ? 'rgba(220,38,38,' : 'rgba(71,85,105,';
      if (!foco) return base + '0.30)';
      return enlResaltados.has(l) ? (l.e === 'bloqueo' ? css('--alarma') : 'rgba(0,82,255,0.55)') : base + '0.06)';
    })
    .linkWidth(l => (foco && enlResaltados.has(l)) ? 0.6 + (l.w || 0.5) * 2.2 : 0)
    .linkOpacity(1)
    .linkDirectionalParticles(l => (foco && enlResaltados.has(l)) ? 3 : 1)
    .linkDirectionalParticleWidth(l => (foco && enlResaltados.has(l)) ? 2.2 : 1.1)
    .linkDirectionalParticleSpeed(l => 0.003 + (l.w || 0.4) * 0.006)
    .linkDirectionalParticleColor(l => l.e === 'bloqueo' ? css('--alarma') : '#0052FF')
    .onNodeHover(n => { hover = n || null; escena.style.cursor = n ? 'pointer' : 'grab'; })
    .onNodeClick(n => enfocar(n, true))
    .onBackgroundClick(() => soltar());
  g.d3Force('charge').strength(-60);

  /* Etiquetas en HTML sobre el lienzo: diagnósticos y especies siempre; con foco, el nodo y sus vecinos. */
  const marcas = new Map();
  function etiquetaDe(n) {
    let el = marcas.get(n);
    if (!el) {
      el = document.createElement('span');
      el.className = 'et' + (n.a ? ' alarma' : '');
      el.textContent = n.l;
      capa.appendChild(el);
      marcas.set(n, el);
    }
    return el;
  }
  function conEtiqueta(n) {
    if (!visibles.has(n.t)) return false;
    if (foco) return resaltados.has(n);
    return n === hover || n.t === 'diagnostico' || n.t === 'especie';
  }
  function pintarEtiquetas() {
    const w = ancho(), h = alto();
    nodos.forEach(n => {
      const quiere = conEtiqueta(n) && n.x !== undefined;
      const el = quiere ? etiquetaDe(n) : marcas.get(n);
      if (!el) return;
      if (!quiere) { el.hidden = true; return; }
      const p = g.graph2ScreenCoords(n.x, n.y, n.z || 0);
      const fuera = p.x < -50 || p.y < -20 || p.x > w + 50 || p.y > h + 20;
      el.hidden = fuera;
      if (fuera) return;
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      el.classList.toggle('foco', n === foco);
      el.classList.toggle('tenue', !foco && n !== hover && n.t !== 'diagnostico');
    });
    requestAnimationFrame(pintarEtiquetas);
  }
  requestAnimationFrame(pintarEtiquetas);

  /* Giro lento de la cámara mientras nadie toca la escena. */
  let girando = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let angulo = 0;
  let radio = 360;
  let altura = 40;
  let encuadrado = false;
  /* Al terminar de acomodarse, encuadra todo el mapa y gira desde ese punto. */
  g.onEngineStop(() => {
    if (encuadrado) return;
    encuadrado = true;
    g.zoomToFit(700, 40);
    setTimeout(() => {
      const c = g.camera().position;
      radio = Math.hypot(c.x, c.z) || radio;
      altura = c.y;
      angulo = Math.atan2(c.x, c.z);
    }, 750);
  });
  setInterval(() => {
    if (!girando || foco || !encuadrado) return;
    angulo += 0.0025;
    g.cameraPosition({ x: radio * Math.sin(angulo), y: altura, z: radio * Math.cos(angulo) }, { x: 0, y: 0, z: 0 });
  }, 16);
  $('girar').setAttribute('aria-pressed', String(girando));
  escena.addEventListener('pointerdown', () => { if (girando) { girando = false; $('girar').setAttribute('aria-pressed', 'false'); } });

  function refrescar() {
    g.nodeColor(g.nodeColor()).linkColor(g.linkColor()).linkWidth(g.linkWidth())
      .linkDirectionalParticles(g.linkDirectionalParticles()).linkDirectionalParticleWidth(g.linkDirectionalParticleWidth());
  }

  function enfocar(n, volar) {
    if (!n) return;
    foco = n;
    resaltados = new Set([n, ...n.vecinos]);
    enlResaltados = new Set(n.enl);
    girando = false;
    $('girar').setAttribute('aria-pressed', 'false');
    refrescar();
    if (volar && n.x !== undefined) {
      const dist = 175;
      const r = Math.hypot(n.x, n.y, n.z || 0) || 1;
      const k = 1 + dist / r;
      g.cameraPosition({ x: n.x * k + 60, y: n.y * k + 80, z: (n.z || 0) * k + (g.numDimensions() === 2 ? dist : 0) }, n, 1100);
    }
    abrirFicha(n);
    $('todo').setAttribute('aria-pressed', 'false');
  }

  function soltar() {
    foco = null;
    resaltados = new Set();
    enlResaltados = new Set();
    refrescar();
    $('ficha').hidden = true;
  }

  function fila(otro, l, papel) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'r';
    const s = document.createElement('span');
    const p = document.createElement('i');
    p.className = 'punto';
    p.style.background = TIPOS[otro.t]?.c || '#94A3B8';
    const em = document.createElement('em');
    em.textContent = otro.l;
    s.append(p, em);
    const peso = document.createElement('span');
    peso.className = 'peso' + (l.e === 'bloqueo' ? ' bloqueo' : '');
    const barra = document.createElement('i');
    barra.style.width = Math.round((l.w ?? (l.e === 'bloqueo' ? 1 : 0.5)) * 100) + '%';
    peso.append(barra);
    const v = document.createElement('small');
    v.textContent = l.w != null ? String(l.w).replace('.', ',') : (l.e === 'bloqueo' ? 'bloquea' : '—');
    b.append(s, peso, v);
    b.title = papel;
    b.addEventListener('click', () => enfocar(otro, true));
    return b;
  }

  function abrirFicha(n) {
    const tipo = TIPOS[n.t] || { n: n.t, c: '#94A3B8' };
    const ojo = $('fichaTipo');
    ojo.textContent = '';
    const pt = document.createElement('i');
    pt.className = 'punto';
    pt.style.background = tipo.c;
    ojo.append(pt, document.createTextNode(tipo.n));
    ojo.style.color = tipo.c;
    $('fichaTitulo').textContent = n.l;
    const chips = $('fichaChips');
    chips.textContent = '';
    const c1 = document.createElement('span');
    c1.className = 'chip';
    c1.textContent = n.grado + (n.grado === 1 ? ' relación' : ' relaciones');
    chips.append(c1);
    if (n.a) {
      const c2 = document.createElement('span');
      c2.className = 'chip rojo';
      c2.textContent = 'Señal de alarma · sube el triage';
      chips.append(c2);
    }
    const cuerpo = $('fichaCuerpo');
    cuerpo.textContent = '';
    const grupos = new Map();
    n.enl.forEach(l => {
      const src = typeof l.source === 'object' ? l.source : porId.get(l.source);
      const dst = typeof l.target === 'object' ? l.target : porId.get(l.target);
      const entrante = dst === n;
      const otro = entrante ? src : dst;
      const titulo = (VERBO[l.r] || [l.r, l.r])[entrante ? 0 : 1];
      if (!grupos.has(titulo)) grupos.set(titulo, []);
      grupos.get(titulo).push({ otro, l });
    });
    grupos.forEach((lista, titulo) => {
      lista.sort((x, y) => (y.l.w ?? 1) - (x.l.w ?? 1));
      const sec = document.createElement('section');
      const h = document.createElement('p');
      h.className = 'tit';
      h.textContent = titulo + ' · ' + lista.length;
      const rel = document.createElement('div');
      rel.className = 'rel';
      lista.forEach(({ otro, l }) => rel.append(fila(otro, l, titulo)));
      sec.append(h, rel);
      cuerpo.append(sec);
    });
    const codigos = new Set();
    n.enl.forEach(l => (l.f || []).forEach(c => codigos.add(c)));
    if (codigos.size) {
      const sec = document.createElement('section');
      const h = document.createElement('p');
      h.className = 'tit';
      h.textContent = 'Fuentes';
      sec.append(h);
      const caja = document.createElement('div');
      caja.style.display = 'flex';
      caja.style.flexDirection = 'column';
      caja.style.gap = '8px';
      [...codigos].slice(0, 4).forEach(c => {
        const f = DATOS.fuentes[c] || { e: c, t: '' };
        const d = document.createElement('div');
        d.className = 'fuente';
        const b = document.createElement('b');
        b.textContent = f.e;
        d.append(b, document.createTextNode(f.t));
        caja.append(d);
      });
      sec.append(caja);
      cuerpo.append(sec);
    }
    const nota = document.createElement('p');
    nota.className = 'nota';
    nota.textContent = 'Pendiente de validación veterinaria. Es apoyo a la decisión: ordena posibilidades, decide el veterinario.';
    cuerpo.append(nota);
    $('ficha').hidden = false;
  }
  $('cerrar').addEventListener('click', soltar);

  /* Tipos: mostrar u ocultar. */
  const conteo = {};
  nodos.forEach(n => { conteo[n.t] = (conteo[n.t] || 0) + 1; });
  Object.entries(TIPOS).forEach(([clave, t]) => {
    if (!conteo[clave]) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tipo';
    b.setAttribute('aria-pressed', 'true');
    const p = document.createElement('i');
    p.className = 'punto';
    p.style.background = t.c;
    const num = document.createElement('b');
    num.textContent = conteo[clave];
    b.append(p, document.createTextNode(t.p + ' '), num);
    b.addEventListener('click', () => {
      const on = visibles.has(clave);
      if (on) visibles.delete(clave); else visibles.add(clave);
      b.setAttribute('aria-pressed', String(!on));
      g.nodeVisibility(g.nodeVisibility()).linkVisibility(g.linkVisibility());
    });
    $('tipos').append(b);
  });

  /* Buscador con sugerencias. */
  const norm = s => s.toLowerCase().normalize('NFD').replace(/\p{Mn}/gu, '');
  const entrada = $('buscar');
  const sug = $('sugerencias');
  entrada.addEventListener('input', () => {
    const q = norm(entrada.value.trim());
    sug.textContent = '';
    if (q.length < 2) { sug.hidden = true; return; }
    const hallados = nodos.filter(n => norm(n.l).includes(q)).slice(0, 7);
    hallados.forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'option');
      const p = document.createElement('i');
      p.className = 'punto';
      p.style.background = TIPOS[n.t]?.c;
      b.append(p, document.createTextNode(n.l));
      b.addEventListener('click', () => { sug.hidden = true; entrada.value = n.l; enfocar(n, true); });
      sug.append(b);
    });
    sug.hidden = hallados.length === 0;
  });
  entrada.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const b = sug.querySelector('button'); if (b) b.click(); }
    if (e.key === 'Escape') { sug.hidden = true; }
  });

  $('dim').addEventListener('click', () => {
    const tres = g.numDimensions() !== 3;
    g.numDimensions(tres ? 3 : 2);
    $('dim').setAttribute('aria-pressed', String(tres));
    $('dim').querySelector('.txt').textContent = tres ? '3D' : 'Plano';
    if (!tres) { girando = false; $('girar').setAttribute('aria-pressed', 'false'); g.cameraPosition({ x: 0, y: 0, z: 420 }, { x: 0, y: 0, z: 0 }, 900); }
  });
  $('girar').addEventListener('click', () => {
    girando = !girando;
    if (girando) soltar();
    $('girar').setAttribute('aria-pressed', String(girando));
  });
  $('todo').addEventListener('click', () => { soltar(); g.zoomToFit(900, 60); });

  /* Pantalla completa: solo responde a un clic; si el navegador no la permite, no pasa nada. */
  $('grande').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) { /* sin pantalla completa en este navegador */ }
  });
  document.addEventListener('fullscreenchange', () => $('grande').setAttribute('aria-pressed', String(Boolean(document.fullscreenElement))));
  addEventListener('resize', () => g.width(ancho()).height(alto()));
})();
</script>
