<style>
body{margin:0}
.tel{width:390px;height:844px;background:#C9CDD8;font-family:Inter,sans-serif;color:#0F172A;position:relative;overflow:hidden;box-sizing:border-box}
.tel *{box-sizing:border-box}
.hoja{position:absolute;left:0;right:0;bottom:0;top:36px;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 32px rgba(15,23,42,.18)}
.asa{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:10px auto 6px;border:0;display:block}
.head{padding:4px 16px 10px}
h2{margin:0;font-size:19px;font-weight:700}
.sub{font-size:13px;color:#64748B;margin-top:2px}
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid #E2E8F0;padding:0 8px}
.paso{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;font-size:13px;font-weight:600;color:#64748B;border-bottom:3px solid transparent}
.paso b{width:22px;height:22px;border-radius:50%;border:1.5px solid #CBD5E1;font-size:12px;display:flex;align-items:center;justify-content:center}
.paso.on{color:#0052FF;border-bottom-color:#0052FF}
.paso.on b{background:#0052FF;border-color:#0052FF;color:#fff}
.paso.ok b{background:rgba(0,82,255,.1);border-color:transparent;color:#0052FF}
.cuerpo{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.fecha{display:flex;align-items:center;gap:10px;height:48px;border-radius:12px;border:1px solid #E2E8F0;background:#F8FAFC;padding:0 12px;font-size:15px;font-weight:600}
.fecha button{margin-left:auto;border:0;background:none;color:#0052FF;font:700 13px Inter,sans-serif;height:36px}
.grupo{display:flex;flex-direction:column;gap:8px}
.gt{font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.04em}
.gt span{text-transform:none;letter-spacing:0;font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{height:44px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;font:600 14px Inter,sans-serif;color:#0F172A}
.slot.on{background:#0052FF;border-color:#0052FF;color:#fff}
.slot.no{color:#CBD5E1;text-decoration:line-through;background:#F8FAFC}
.resumen{border-radius:14px;background:#F8FAFC;border:1px solid #E2E8F0;padding:12px 14px;font-size:14px;line-height:1.5}
.resumen b{display:block;font-size:13px;color:#64748B;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#EA580C;margin:0 4px 1px 2px}
.pie{display:flex;gap:10px;align-items:center;padding:12px 16px 20px;border-top:1px solid #F1F5F9}
.txt{height:48px;padding:0 14px;border:0;background:none;font:600 15px Inter,sans-serif;color:#475569}
.prim{flex:1;height:48px;border-radius:14px;border:0;background:#0052FF;color:#fff;font:700 15px Inter,sans-serif}
</style>
</helmet>
<div class="tel">
  <section class="hoja" role="dialog" aria-labelledby="ncTitulo3">
    <button class="asa" type="button" aria-label="Cerrar"></button>
    <div class="head"><h2 id="ncTitulo3">Nueva cita</h2><div class="sub">Doki · Naranja</div></div>
    <nav class="pasos" aria-label="Pasos"><span class="paso ok"><b>1</b>Paciente</span><span class="paso ok"><b>2</b>Urgencia</span><span class="paso on" aria-current="step"><b>3</b>Horario</span></nav>
    <div class="cuerpo">
      <div class="fecha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Viernes 30/10/2026<button type="button">Cambiar día</button></div>
      <div class="grupo" role="group" aria-label="Mañana"><span class="gt">Mañana <span>· 3 libres</span></span>
        <div class="slots"><button class="slot on" type="button" aria-pressed="true">9:00 a. m.</button><button class="slot" type="button">10:00 a. m.</button><button class="slot no" type="button" disabled>10:30 a. m.</button><button class="slot" type="button">11:30 a. m.</button></div>
      </div>
      <div class="grupo" role="group" aria-label="Tarde"><span class="gt">Tarde <span>· 2 libres</span></span>
        <div class="slots"><button class="slot" type="button">2:00 p. m.</button><button class="slot" type="button">3:40 p. m.</button></div>
      </div>
      <div class="resumen" role="status"><b>Resumen</b>Doki · Consulta general · <span class="dot" aria-hidden="true"></span>Naranja<br>Viernes 30/10 · 9:00 a. m. · Beto Norte</div>
    </div>
    <div class="pie"><a class="txt" href="Agendar2.dc.html" style="display: flex; align-items: center; text-decoration: none">Atrás</a><button class="prim" type="button">Agendar cita</button></div>
  </section>
</div>
</x-dc>
