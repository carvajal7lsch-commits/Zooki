<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio · Calendario del mes en hoja inferior</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tel{width:390px;height:844px;background:#C9CDD8;font-family:Inter,sans-serif;color:#0F172A;position:relative;overflow:hidden;box-sizing:border-box}
.tel *{box-sizing:border-box}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 16px 24px;box-shadow:0 -12px 32px rgba(15,23,42,.18)}
.asa{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 12px;border:0;display:block}
.cab{display:flex;align-items:center;gap:6px;margin-bottom:8px}
h2{margin:0 auto 0 0;font-size:18px;font-weight:700}
.flecha{width:40px;height:40px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;color:#475569;display:flex;align-items:center;justify-content:center}
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:700;color:#94A3B8;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.d{height:46px;border:0;border-radius:12px;background:transparent;font:600 15px Inter,sans-serif;color:#0F172A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.d i{width:4px;height:4px;border-radius:50%;background:#0052FF}
.d.v{visibility:hidden}
.d.sel{background:#0052FF;color:#fff}
.d.sel i{background:#fff}
.d.fin{color:#64748B}
.ley{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748B;margin-top:10px}
.ley i{width:6px;height:6px;border-radius:50%;background:#0052FF}
</style>
</helmet>
<div class="tel">
  <section class="hoja" role="dialog" aria-labelledby="calTitulo">
    <button class="asa" type="button" aria-label="Cerrar calendario"></button>
    <div class="cab">
      <h2 id="calTitulo">Octubre 2026</h2>
      <button class="flecha" type="button" aria-label="Mes anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="flecha" type="button" aria-label="Mes siguiente"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="sem" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid">
      <sc-for list="{{dias}}" as="d" hint-placeholder-count="35">
        <button class="d {{d.clase}}" type="button">{{d.n}}<sc-if value="{{d.punto}}" hint-placeholder-val="{{false}}"><i></i></sc-if></button>
      </sc-for>
    </div>
    <div class="ley"><i></i>Días con citas · al tocar un día, la agenda muestra esa fecha</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const puntos = [5, 6, 7, 22, 23, 26];
    const dias = [];
    for (let i = 0; i < 3; i++) dias.push({ n: '', clase: 'v', punto: false });
    for (let n = 1; n <= 31; n++) {
      const col = (n + 2) % 7;
      dias.push({ n: String(n), punto: puntos.includes(n), clase: n === 23 ? 'sel' : (col === 5 || col === 6 ? 'fin' : '') });
    }
    return { dias };
  }
}
</script>
</body>
</html>
