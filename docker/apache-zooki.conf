# F0 (B.5) — Solo public/ se sirve por web.
#
# Antes la imagen dejaba la raíz de Apache en /var/www/html y la aplicación en
# /var/www/html/Zooki: cualquier petición que llegara al contenedor sin pasar
# por el proxy podía pedir /Zooki/.env, /Zooki/composer.json o /Zooki/database/.
# Ahora la raíz es public/ y todo lo demás de /var/www/html queda denegado.
#
# Las URL públicas no cambian: «/», «?action=», /docs/ y ver_archivo.php
# salen de public/. Si el proxy todavía apunta a /Zooki/public/, ese camino
# también lleva a public/ (Alias), así que el corte no exige tocar el proxy
# a la vez que la imagen.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/Zooki/public
    Alias /Zooki/public /var/www/html/Zooki/public

    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/Zooki/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Revisión F0: los adjuntos clínicos solo salen por ver_archivo.php. El
    # .htaccess de clinicos/ no está en git ni en la imagen, así que el bloqueo
    # vive aquí y no depende del contenido del volumen «uploads».
    <Directory /var/www/html/Zooki/public/uploads/clinicos>
        Require all denied
    </Directory>

    # Ningún archivo oculto (.htaccess, .gitkeep, .env que alguien copie aquí).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
